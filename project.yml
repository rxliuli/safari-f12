name: SafariF12

# The single source of truth for the .xcodeproj (the generated one is gitignored).
# Why it is needed: SwiftPM does not produce a .app (no bundle layout / Info.plist placement /
# signing or notarization), and those are exactly what shipping requires - only
# `xcodebuild archive` hands them to you. Package.swift stays for day-to-day `swift run`
# development, with both sharing the same Sources.
#
# A hand-maintained project.pbxproj rots (that is how AppDowngrader broke), hence xcodegen.

options:
  bundleIdPrefix: com.rxliuli
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The **single source of truth** for the version is right here: Resources/Info.plist holds
    # $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION), substituted by Xcode at build time.
    # The release CI reads this file with rxliuli/version-check to decide whether to publish, so
    # a version bump is a one-line change here and nowhere else.
    MARKETING_VERSION: "0.1.6"
    # The build number is derived from the version as x*10000 + y*100 + z (0.1.6 -> 106).
    # dmg.sh computes the same value in CI and overrides this; the value here only serves local
    # archives.
    CURRENT_PROJECT_VERSION: "106"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N2X78TUUFG

targets:
  SafariF12:
    type: application
    platform: macOS
    sources:
      - path: Sources/SafariF12
      # Convention: whatever is in Resources/ lands verbatim in Contents/Resources/.
      # Info.plist has to be excluded (leaving it in Copy Bundle Resources makes Xcode fail),
      # and INFOPLIST_FILE turns it into Contents/Info.plist instead.
      - path: Resources
        excludes:
          - Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SafariF12
        PRODUCT_BUNDLE_IDENTIFIER: com.rxliuli.safari-f12
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
