name: SafariF12

# .xcodeproj 的唯一真相来源（生成物在 .gitignore 里）。
# 为什么需要它：SwiftPM 不产出 .app（没有 bundle 布局 / Info.plist 落位 / 签名公证），
# 那些正是发布需要的全部，只有 xcodebuild archive 现成给你。
# Package.swift 保留给 `swift run` 的日常开发，两边共用同一份 Sources。
#
# 用手工维护的 project.pbxproj 会腐烂（AppDowngrader 就是这么坏的），所以用 xcodegen。

options:
  bundleIdPrefix: com.rxliuli
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 版本号真相在 Resources/Info.plist（发版 CI 读它判断要不要发）；
    # 这里只服务于本机 archive，发版时由 release.yml 覆盖。
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "0.1.5"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N2X78TUUFG

targets:
  SafariF12:
    type: application
    platform: macOS
    sources:
      - path: Sources/SafariF12
      # 约定：Resources/ 的内容原样进 Contents/Resources/。
      # Info.plist 必须排除（它在 Copy Bundle Resources 里会让 Xcode 报错），
      # 它由 INFOPLIST_FILE 处理成 Contents/Info.plist。
      - path: Resources
        excludes:
          - Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SafariF12
        PRODUCT_BUNDLE_IDENTIFIER: com.rxliuli.safari-f12
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
